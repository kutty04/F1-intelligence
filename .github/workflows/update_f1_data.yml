name: Update F1 Data

on:
  schedule:
    # Runs every Monday at 08:00 UTC (after most race weekends)
    - cron: '0 8 * * 1'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Data Fetching
        run: python -m backend.scripts.fetch_races
        env:
          # FastF1 uses a local cache; in CI, we'll just download fresh
          FASTF1_CACHE_DIR: ./fastf1_cache

      - name: Run Grid Analysis
        run: python -m backend.scripts.analyze_grid

      - name: Train ML Model
        run: python -m backend.scripts.train_model

      - name: Commit and Push changes
        run: |
          git config --global user.name 'F1 Data Bot'
          git config --global user.email 'bot@f1-intelligence.local'
          git add backend/data/processed/*.csv backend/models/*.joblib
          git commit -m "Automated data update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
